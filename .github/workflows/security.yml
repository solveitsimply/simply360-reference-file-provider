# Supply-chain security skeleton: dependency review on PRs, plus SBOM and
# build provenance on pushes to `dev`. All third-party actions are pinned to a
# full commit SHA (Ratified Direction 21: pinned workflow actions). Activates
# when GitHub Actions billing is restored account-wide.
name: security

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  dependency-review:
    # PR-only: fails the PR if a newly introduced dependency has a known
    # vulnerability or a disallowed license.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: moderate

  sbom-provenance:
    # Push-only: emit an SPDX SBOM and a signed build-provenance attestation
    # for the built artifact.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      - name: Install (dev tooling only)
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-path: "dist/**/*.js"
